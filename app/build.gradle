plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.posapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.posapp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
    
    // حل مشكلة MediaTek والأجهزة المختلفة
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        // استبعاد ملفات MediaTek المشكوك فيها
        exclude '**/mediatek/**'
        exclude '**/mtk/**'
    }
    
    // تعامل مع أخطاء النظام
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }
}

dependencies {
    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.firestore
    implementation libs.firebase.analytics
    implementation libs.google.firebase.auth

    // Google Play Services
    implementation libs.play.services.auth
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // OpenStreetMap
    implementation 'org.osmdroid:osmdroid-android:6.1.17'

    // QR Code Generation
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // CSV Files Support - Better Android compatibility
    implementation 'com.opencsv:opencsv:5.7.1'

    // JSON parsing for UserSession
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Charts Library for Analytics
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Android Core Dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.fragment
    implementation libs.firebase.auth
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}